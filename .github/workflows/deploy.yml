name: Build & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build Next.js Application
      run: npm run build
      working-directory: ./frontend

    - name: Run Tests (Agent Logic)
      run: echo "Running agent tests..."

    - name: Deploy to Vercel (Preview)
      if: github.ref != 'refs/heads/main'
      run: echo "Preview Deployment triggered on Vercel"

    - name: Deploy to Vercel (Production)
      if: github.ref == 'refs/heads/main'
      run: echo "Production Deployment triggered on Vercel"
