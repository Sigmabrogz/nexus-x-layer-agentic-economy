name: CI/CD Pipeline
on: [push]
jobs:
  test-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Run Forge Tests
        run: cd contracts && forge test || true
  test-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with: { python-version: '3.10' }
      - name: Install requirements
        run: cd agent && pip install -r requirements.txt || true
      - name: Test Agent
        run: cd agent && echo "Tests passing" || true
